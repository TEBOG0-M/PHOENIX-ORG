<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — PHOENOX</title>
  <meta name="description" content="Sign in to your PHOENOX volunteer, donor or manager portal.">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root="../" data-page="login">
  <div id="site-header"></div>
  <main id="main" class="">

    <section class="auth-main"><div class="wrap">
      <div class="auth-card">
        <h1 style="margin-top:14px">Sign in to PHOENOX</h1>
        <p class="sub">Enter your credentials to access your mission dispatch, volunteer schedule, or donor portal.</p>
        <form id="auth-form" novalidate>
          <div class="form-msg" id="form-msg" hidden></div>
          <div class="field"><label for="email">Email address</label><div class="control"><i data-i="at"></i><input id="email" type="email" placeholder="you@example.org" autocomplete="email" required></div></div>
          <div class="field"><label for="password">Security passcode <a href="forgot-password.html" style="font-size:.78rem;text-transform:none;letter-spacing:0;font-weight:500">Forgot password?</a></label>
            <div class="control"><i data-i="key"></i><input id="password" class="has-reveal" type="password" placeholder="••••••••••" autocomplete="current-password" required><button class="reveal" type="button" data-pw-toggle="password" aria-label="Show password"><i data-i="eye"></i></button></div></div>
          <button class="btn btn-primary btn-block btn-lg" type="submit" style="margin-top:14px">Sign In to Portal <i data-i="arrow-right"></i></button>
        </form>
        <div class="hr-label">or continue with secure provider</div>
        <button class="btn-google" id="google-btn" type="button"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg> Continue with Google</button>
        <p class="foot">Don’t have an active credential profile? <a href="register.html">Register here</a></p>
      </div>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="../assets/js/auth-page.js"></script>
</body>
</html>
