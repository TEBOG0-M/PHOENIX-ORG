<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — PHOENOX</title>
  <meta name="description" content="Reset your PHOENOX password.">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root="../" data-page="forgot">
  <div id="site-header"></div>
  <main id="main" class="">

    <section class="auth-main"><div class="wrap">
      <div class="auth-card">
        <div class="auth-icon"><img class="logo-mark" src="../assets/logo.svg" alt="" width="56" height="56"></div>
        <h1>Reset your passcode</h1>
        <p class="sub">Enter the email you registered with and we’ll send you a secure link to choose a new password.</p>
        <form id="auth-form" novalidate>
          <div class="form-msg" id="form-msg" hidden></div>
          <div class="field"><label for="email">Email address</label><div class="control"><i data-i="at"></i><input id="email" type="email" placeholder="you@example.org" autocomplete="email" required></div></div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">Send reset link <i data-i="arrow-right"></i></button>
        </form>
        <p class="foot"><a href="login.html">← Back to sign in</a></p>
      </div>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="../assets/js/auth-page.js"></script>
</body>
</html>
