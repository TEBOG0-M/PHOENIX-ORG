name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - "!mobile-app/releases/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - "!mobile-app/releases/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Publish latest debug APK to main
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        working-directory: .
        run: |
          mkdir -p mobile-app/releases
          cp mobile-app/app/build/outputs/apk/debug/app-debug.apk mobile-app/releases/phoenix-latest.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mobile-app/releases/phoenix-latest.apk

          if git diff --cached --quiet; then
            echo "The published APK is already up to date."
          else
            git commit -m "chore(android): publish latest debug APK"
            git push origin HEAD:main
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: phoenix-org-debug-apk
          path: mobile-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phoenix-org-unit-test-reports
          path: mobile-app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
